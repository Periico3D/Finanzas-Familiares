<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanzas Familiares</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Finanzas" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f5f3; --bg3: #efefec;
      --text: #1a1a18; --text2: #6b6b67; --text3: #9b9b96;
      --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
      --radius: 8px; --radius-lg: 12px;
      --teal: #1D9E75; --blue: #378ADD; --coral: #D85A30;
      --amber: #BA7517; --purple: #7F77DD; --green: #639922;
      --red: #E24B4A; --pink: #D4537E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --bg2: #2a2a27; --bg3: #323230;
        --text: #f0efe8; --text2: #a8a89f; --text3: #6e6e67;
        --border: rgba(255,255,255,0.12); --border2: rgba(255,255,255,0.22);
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #app { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 20px; font-weight: 500; }
    h2 { font-size: 16px; font-weight: 500; }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; background: var(--bg2); color: var(--text); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 7px 10px; font-size: 14px; width: 100%; outline: none; }
    input:focus { border-color: var(--blue); }
    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
    .metric { background: var(--bg2); border-radius: var(--radius); padding: 12px 16px; }
    .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    .metric-value { font-size: 20px; font-weight: 500; }
    .metric-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .grid { display: grid; gap: 10px; }
    .btn { background: none; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 5px 12px; font-size: 12px; color: var(--text2); }
    .btn:hover { background: var(--bg2); }
    .btn-primary { background: var(--bg2); font-weight: 500; color: var(--text); }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
    .row:last-child { border-bottom: none; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 16px 0; }
    .tab { padding: 6px 12px; border-radius: var(--radius); font-size: 12px; border: 0.5px solid transparent; background: none; color: var(--text); }
    .tab.active { background: var(--bg2); border-color: var(--border2); font-weight: 500; }
    .progress-wrap { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 4px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; width: min(92vw, 420px); max-height: 82vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .alert { display: flex; gap: 10px; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
    .alert-ok { background: #EAF3DE; color: #3B6D11; }
    .alert-warn { background: #FAEEDA; color: #854F0B; }
    .alert-danger { background: #FCEBEB; color: #A32D2D; }
    .dot { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background: var(--coral); border-radius: 50%; }
    .tab-wrap { position: relative; display: inline-block; }
    .save-indicator { font-size: 11px; color: var(--teal); margin-top: 2px; height: 14px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
